# LiteFS 示例应用配置
# 单机模式配置示例

server:
  port: 8080

spring:
  application:
    name: litefs-example
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 0
  h2:
    console:
      enabled: true
      path: /h2-console

litefs:
  replication:
    default-strategy: MINIMAL
    consistency: EVENTUAL
  node-id: node-1
  registry:
    type: static
    static-config:
      nodes:
        - id: node-1
          host: 192.168.10.100
          port: 8080
          total-space: 10737418240
        - id: node-2
          host: 192.168.10.101
          port: 8080
          total-space: 10737418240
        - id: node-3
          host: 192.168.10.102
          port: 8080
          total-space: 10737418240
